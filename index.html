*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#222f29;font:16px "DM Sans",system-ui,sans-serif}header{border-bottom:1px solid #c9cbbf;padding:16px 6%;display:flex;align-items:center;justify-content:space-between}strong{font-size:20px}em{background:#b43d2d;color:white;padding:5px 8px;border-radius:5px;font-style:normal}button,select{font:inherit;color:inherit;cursor:pointer;border:1px solid #bbbfb4;background:#fffdf7;border-radius:9px;padding:10px 16px}button:hover{filter:brightness(.94)}main{max-width:820px;margin:4vh auto;padding:0 20px}h1{font:normal clamp(36px,6vw,58px) Georgia,serif;letter-spacing:-2px;margin:0 0 18px}.row,footer{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stage{position:relative;display:grid;place-items:center;align-content:center;gap:12px;background:#204f41;color:#fff9e7;min-height:clamp(280px,43vh,560px);border-radius:20px;margin:16px 0;box-shadow:0 5px #bed0bb;overflow:hidden}.stage:before,.stage:after{content:"";position:absolute;pointer-events:none;width:240px;height:240px;border:1px solid #78978155;transform:rotate(45deg)}.stage:before{left:-190px;top:-80px}.stage:after{right:-170px;bottom:-125px}.stage small{position:absolute;top:20px;left:22px;letter-spacing:.12em}.word{background:none;border:0;color:inherit;font:clamp(80px,13vw,148px) "KaiTi","Noto Serif CJK SC",serif;padding:0 12px}.sound{background:#ffffff12;border-color:#8aa497;color:white}.answer{font:clamp(38px,7vw,72px) Georgia,serif;text-align:center}.meaning{text-align:center;padding:0 15px}.primary{background:#ae3b2d;color:white;border-color:#ae3b2d}footer{margin-top:22px}progress{width:100%;height:6px;accent-color:#226449}#status{min-height:1.5em;color:#823427}body.kelas main{max-width:1100px}body.kelas .stage{min-height:52vh}[hidden]{display:none!important}@media(max-width:480px){header{padding:12px}main{padding:0 14px}button,select{padding:10px}.row{gap:6px}}

u</option><option value="single">Latihan acak</option></select></div><section id="practice" hidden><span id="count"></span><div class="view3d"><div id="randomTurn" class="turn"><section id="randomFront" class="stage randomFace"><small>HANZI</small><button class="word" id="word" lang="zh-CN" aria-label="Balik kartu"></button><button class="sound" id="sound" aria-label="Putar pelafalan Mandarin" title="Putar pelafalan">&#9835;</button></section><section id="randomReverse" class="stage randomFace reverse" inert><small id="label"></small><div class="answer" lang="zh-Latn" id="pin"></div><div class="meaning" id="arti"></div><button class="sound" id="backSound" aria-label="Putar pelafalan Mandarin" title="Putar pelafalan">&#9835;</button></section></div></div><progress id="bar" aria-label="Progres sesi"></progress><footer><button id="back">Sebelumnya</button><button id="mark" hidden>Ulangi</button><button id="next" class="primary">Balik kartu</button></footer><p id="status" role="status"></p></section><section id="table"><p id="pickedCount"></p><div id="board"></div><button id="resetBoard" hidden>Acak & main lagi</button></section><dialog id="pick"><button id="pickClose" aria-label="Tutup kartu">&times;</button><div class="view3d"><div class="turn" id="turn"><div class="face front" id="front"><div id="pickedWord" lang="zh-CN"></div><button id="pickSound" aria-label="Putar pelafalan Mandarin">&#9835;</button></div><div class="face reverse" id="reverse" inert><div id="pickedPinyin" lang="zh-Latn"></div><div id="pickedMeaning"></div></div></div></div><button id="pickAction" class="primary">Balik kartu</button><div id="pickStatus" role="status"></div></dialog></main><script>
const cards=`你|nǐ|Kamu

能打|néng dǎ|Bisa kita lawan!

慢慢打|mànman dǎ|Main pelan-pelan.`.split('\n').map(line=>line.split('|'));
const el=id=>document.getElementById(id), synth=window.speechSynthesis;
let queue=cards,index=0,flipped=false,marks=new Set();
function shuffled(list){
  const result = [...list];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function start(list){queue=shuffled(list);index=0;marks=new Set();show(false)}
function show(side){synth?.cancel();flipped=side;const card=queue[index],done=!card;
el('label').textContent=done?'SESI SELESAI':side?'PINYIN & ARTI':'HANZI';
el('count').textContent=Math.min(index+1,queue.length)+' / '+queue.length;
el('bar').max=queue.length;el('bar').value=index;
const reverse=side||done;
const turn=el('randomTurn');
turn.classList.toggle('resetFace',!side);
turn.classList.toggle('turned',reverse);
el('randomFront').inert=reverse;
el('randomReverse').inert=!reverse;
el('backSound').hidden=done;
el('word').textContent=card?.[0]||'';
el('pin').textContent=done?'Sesi selesai':side?card[1]:'';
el('arti').textContent=done?marks.size+' kartu ditandai untuk diulangi.':side?card[2]:'';
el('sound').hidden=done;el('mark').hidden=done||!side;
el('mark').textContent=marks.has(card)?'Batalkan tanda':'Tandai ulangi';
el('next').textContent=done?(marks.size?'Latih kartu bertanda':'Mulai lagi'):side?(index+1===queue.length?'Selesaikan':'Berikutnya'):'Balik kartu';
el('back').disabled=index===0;el('status').textContent=''}

el('word').onclick=()=>show(true);el('back').onclick=()=>{index--;show(false)};
el('mark').onclick=()=>{let c=queue[index];if(marks.has(c))marks.delete(c);else marks.add(c);show(true)};
el('next').onclick=()=>{if(index===queue.length)return start(marks.size?[...marks]:cards);if(flipped){index++;show(false)}else show(true)};
const audioError=target=>target.textContent='Audio Mandarin belum tersedia. Aktifkan suara Mandarin di pengaturan perangkat.';
synth?.getVoices();el('sound').onclick=()=>speak(queue[index][0],el('status'));el('backSound').onclick=el('sound').onclick;function speak(word,target){if(!synth)return audioError(target);synth.cancel();const msg=new SpeechSynthesisUtterance(word);msg.lang='zh-CN';msg.rate=.85;const voice=synth.getVoices().find(v=>/^(zh[-_](CN|Hans)|cmn)/i.test(v.lang));if(voice)msg.voice=voice;msg.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))audioError(target)};synth.speak(msg)};
const mode = el('mode');
const board = el('board');
const dialog = el('pick');
const completed = new Set();
let layout = [], chosen, answered;
function resetBoard(){
  completed.clear();
  layout = shuffled(cards);
  board.replaceChildren();
  layout.forEach((card, position)=>{
    const tile=document.createElement('button');
    tile.className='tile';
    tile.textContent=card[0];
    tile.lang='zh-CN';
    tile.setAttribute('aria-label','Pilih kartu '+card[0]);
    tile.onclick=()=>{
      chosen=position;
      answered=false;
      el('pickedWord').textContent=card[0];
      el('turn').classList.remove('turned');
      el('front').inert=false;
      el('reverse').inert=true;
      el('pickedPinyin').textContent=card[1];
      el('pickedMeaning').textContent=card[2];
      el('pickAction').textContent='Balik kartu';
      el('pickStatus').textContent='';
      const from=tile.getBoundingClientRect();
      dialog.showModal();
      if(dialog.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        const to=dialog.getBoundingClientRect();
        const dx=from.left+from.width/2-to.left-to.width/2;
        const dy=from.top+from.height/2-to.top-to.height/2;
        dialog.animate([
          {transform:'translate('+dx+'px,'+dy+'px) scale('+from.width/to.width+','+from.height/to.height+')',backgroundColor:'#782d30',color:'#ffe5ac'},
          {transform:'none',backgroundColor:'#fff5df',color:'#491e23'}
        ],{duration:420,easing:'cubic-bezier(.2,.75,.2,1)'});
      }
    };
    board.append(tile);
  });
  updateBoard();
}
function updateBoard(){
  el('pickedCount').textContent=completed.size+' / '+layout.length+' selesai';
  el('resetBoard').hidden=completed.size!==layout.length;
}
el('pickAction').onclick=()=>{
  if(!answered){
    answered=true;
    el('turn').classList.add('turned');
    el('front').inert=true;
    el('reverse').inert=false;
    el('pickAction').textContent='Selesai & kembali';
    return;
  }
  completed.add(chosen);
  board.children[chosen].disabled=true;
  updateBoard();
  dialog.close();
  (Array.from(board.children).find(tile=>!tile.disabled)||el('resetBoard')).focus();
};
el('pickClose').onclick=()=>dialog.close();
dialog.onclose=()=>{synth?.cancel();dialog.getAnimations?.().forEach(animation=>animation.cancel())};
el('pickSound').onclick=()=>speak(layout[chosen][0],el('pickStatus'));
el('resetBoard').onclick=resetBoard;
mode.onchange=()=>{
  synth?.cancel();
  const picking=mode.value==='pick';
  el('practice').hidden=picking;
  el('table').hidden=!picking;
  if(picking&&!layout.length)resetBoard();
};
function classroom(active){document.body.classList.toggle('kelas',active);el('kelas').textContent=active?'Keluar mode kelas':'Mode kelas'}
el('kelas').onclick=async()=>{const active=!document.body.classList.contains('kelas');classroom(active);try{if(active)await document.documentElement.requestFullscreen?.();else if(document.fullscreenElement)await document.exitFullscreen()}catch{}};
document.onfullscreenchange=()=>classroom(!!document.fullscreenElement);start(cards);mode.onchange()
</script></html>
